---
# Evaluation configuration for LM-Eval Harness CronJob.
# Edit EVAL_TASKS to change which benchmarks run each night.
# Edit MLFLOW_TRACKING_URI if the MLflow service name or namespace changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-config
  namespace: vllm
data:
  VLLM_BASE_URL: "http://vllm-nemotron-12b.vllm.svc.cluster.local:8000/v1"
  MLFLOW_TRACKING_URI: "http://mlflow.mlflow.svc.cluster.local:5000"
  MODEL_ID: "nvidia/Nemotron-Elastic-12B"
  EVAL_TASKS: "mmlu,arc_easy,gsm8k"
  BATCH_SIZE: "8"
  RESULTS_DIR: "/mnt/results"
  MLFLOW_EXPERIMENT: "jarvis-inference-models"
